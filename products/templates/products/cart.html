
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Cart | FiltrCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body style="background:#f1f3f6;">

<nav class="navbar navbar-dark px-4" style="background:#2874f0;">
    <a class="navbar-brand fw-bold" href="/api/page/">FiltrCart</a>
    <a class="text-white" href="/products/">Continue Shopping</a>
</nav>

<div class="container py-4">
    <div class="bg-white rounded p-4">
        <h2>My Shopping Cart</h2>
        <hr>

        {% for item in cart_items %}
        <div class="row align-items-center mb-4">
            <div class="col-md-2">
                <img src="{{ item.product.image_url }}"
                     alt="{{ item.product.name }}"
                     class="img-fluid"
                     style="max-height:120px;object-fit:contain;">
            </div>

            <div class="col-md-6">
                <h5>{{ item.product.name }}</h5>
                <p>Price: ₹{{ item.product.selling_price }}</p>
                <p>Quantity: {{ item.quantity }}</p>
            </div>

            <div class="col-md-4">
                <strong>Subtotal: ₹{{ item.subtotal }}</strong>
            </div>
        </div>
        <hr>
        {% empty %}
        <p>Your cart is empty.</p>
        {% endfor %}

        <h4 class="text-end">Total: ₹{{ total }}</h4>

        <a href="/products/" class="btn btn-primary mt-3">
            Continue Shopping
        </a>
    </div>
</div>

</body>
</html>
