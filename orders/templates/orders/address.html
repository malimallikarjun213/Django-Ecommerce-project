
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Address | FiltrCart</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            color: #172337;
        }
        header {
            background: #2874f0;
            color: white;
            padding: 18px 7%;
            font-size: 24px;
            font-weight: bold;
        }
        main {
            max-width: 760px;
            margin: 30px auto;
            padding: 24px;
            background: white;
            border-radius: 12px;
        }
        h2 { margin-top: 0; }
        .steps {
            color: #2874f0;
            margin-bottom: 24px;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }
        textarea { resize: vertical; }
        .full { grid-column: 1 / -1; }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 15px;
            border: 0;
            border-radius: 8px;
            background: #2874f0;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
        }
        @media (max-width: 600px) {
            main { margin: 15px; padding: 18px; }
            .grid { grid-template-columns: 1fr; }
            .full { grid-column: auto; }
        }
    </style>
</head>
<body>
<header>FiltrCart</header>

<main>
    <div class="steps">1. Delivery Address → 2. Confirm Details → 3. Payment</div>
    <h2>Enter Delivery Address</h2>
    <p>Where should we deliver your order?</p>

    {% for message in messages %}
        <div class="error">{{ message }}</div>
    {% endfor %}

    <form method="post">
        {% csrf_token %}

        <div class="grid">
            <div>
                <label for="full_name">Full Name</label>
                <input id="full_name" name="full_name"
                       value="{{ request.POST.full_name|default:'' }}"
                       maxlength="150" required>
            </div>

            <div>
                <label for="phone">Mobile Number</label>
                <input id="phone" name="phone" type="tel"
                       value="{{ request.POST.phone|default:'' }}"
                       pattern="[0-9]{10,15}"
                       title="Enter 10 to 15 digits" required>
            </div>

            <div class="full">
                <label for="email">Email Address</label>
                <input id="email" name="email" type="email"
                       value="{{ request.POST.email|default:'' }}"
                       maxlength="254" required>
            </div>

            <div class="full">
                <label for="address">House No. / Street / Area</label>
                <textarea id="address" name="address"
                          rows="3" maxlength="1000"
                          required>{{ request.POST.address|default:'' }}</textarea>
            </div>

            <div>
                <label for="city">City</label>
                <input id="city" name="city"
                       value="{{ request.POST.city|default:'' }}"
                       maxlength="100" required>
            </div>

            <div>
                <label for="state">State</label>
                <input id="state" name="state"
                       value="{{ request.POST.state|default:'' }}"
                       maxlength="100" required>
            </div>

            <div>
                <label for="pincode">PIN Code</label>
                <input id="pincode" name="pincode"
                       inputmode="numeric" pattern="[0-9]{6}"
                       maxlength="6"
                       value="{{ request.POST.pincode|default:'' }}"
                       required>
            </div>
        </div>

        <button type="submit">Continue to Confirm Details →</button>
    </form>
</main>
</body>
</html>
