
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiltrCart - UPI Payment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            margin: 0;
            padding: 24px;
        }
        .payment-box {
            max-width: 440px;
            margin: 30px auto;
            background: white;
            padding: 24px;
            border-radius: 10px;
            text-align: center;
        }
        .amount {
            font-size: 28px;
            font-weight: bold;
            color: #2874f0;
        }
        .pending {
            color: #b45309;
            background: #fef3c7;
            padding: 10px;
            border-radius: 6px;
        }
        .qr {
            width: 220px;
            height: 220px;
            margin: 16px auto;
            border: 1px dashed #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="payment-box">
        <h2>FiltrCart</h2>
        <h3>UPI / QR Payment</h3>

        <p>Total Amount</p>
        <div class="amount">₹{{ total|floatformat:2 }}</div>

        <div class="qr">
            <p>Merchant QR code will appear here after setup.</p>
        </div>

        <p>Scan the official merchant QR using your UPI app.</p>

        <p class="pending">
            Payment status: Pending verification
        </p>

        <p>
            Payment successful झाल्यानंतर server-side verification
            पूर्ण होईपर्यंत order paid समजू नका.
        </p>
    </div>
</body>
</html>
