
{% load static %}

<nav class="pro-navbar">
    
   <div> <span class="brand-icon">🛒 ProShop</span></div></br>

<style>
    .pro-navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 22px;
        flex-wrap: wrap;
        padding: 18px 4%;
        background: #102b49;
        font-family: Arial, sans-serif;
        box-shadow: 0 3px 12px #0002;
    }

    .brand {
        display: flex;
        align-items: center;
        color: white;
        text-decoration: none;
        font-size: 25px;
        font-weight: bold;
        white-space: nowrap;
    }

    .brand-icon {
        margin-right: 8px;
    }

   
    .nav-search {
        display: flex;
        flex: 1;
        max-width: 260px;
        min-width: 160px;
        background: white;
        border-radius: 20px;
        overflow: hidden;
    }

    .nav-search input {
        width: 100%;
        min-width: 0;
        padding: 10px 14px;
        border: none;
        outline: none;
    }

    .nav-search button {
        padding: 0 14px;
        background: #1677ff;
        color: white;

    }

    .nav-links, .nav-actions {

        text-decoration: none;
        font-size: 14px;
        white-space: nowrap;
    }

    }

        }

            flex-wrap: wrap;
            justify-content: center;
        }
    }

    @media (max-width: 550px) {

        }
