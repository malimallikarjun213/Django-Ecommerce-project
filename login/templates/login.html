<html>
<head>
    <meta name="viewport" content="device-width ,initial-scale=1.0">
    <title>This is login page</title>
    <style>
body{
    min-height: 100vh;
    background: rgb(227, 223, 223);
    

}
.center{   
    align-items: center;
    margin-left: calc(50% - 250px);
    position: center; 
}
form {
    width: 400px;
    margin: 100px auto;
}
.login-card{
    width: 500px;
    height: 600px;
    border-radius: 25px;
    background:white;
    
}
.login-header{
    background: darkblue;
    text-align: center;
    color: black;
    width: 500px ;
    height:300px;
    border-radius: 20px;
    
}
.shield{
    font-size: 38px;  
    background-color: darkblue;
    border-radius: 25px;
    height: 80px;
}
.shield h2,p{ margin-bottom: 15px; margin-top: 30px;color: gray;}
.shield b{ margin-bottom: 15px; margin-top: 30px;color:rgb(149, 20, 117);}
.input-group{
    margin-bottom: 0px;
    margin-top: 20px;

}
button{
   width: 60px;
   height: 25px;
    background-color: pink;
    font-size: 15px;
    font-weight: bold;
    
}
p1{
    font-size: 20px;
    margin-left: 200px;
    position: relative;
    margin-top: 50px;
}
.input-box{
    font-size: 20px;
    font-weight: black;
    width: 100%;
    height: 50px;
    border: 2px blue solid;
    border-radius: 10px;
}

 .error-message {
        color: red;     
        text-align: center; 
        margin-top:20px; 
        font-size: 18px;
        font-style: monospace;
        margin-left: 125px;
       position:absolute;
    }
</style>
    <script>
    setTimeout(function() {
        var message = document.getElementsByClassName("error-message")[0];

        if (message) {
            message.style.display = "none";
        }
    }, 3000);
    function togglePassword() {
        var passwordInput = document.getElementsByName("password")[0];
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
        } else {
            passwordInput.type = "password";
        }
    }
</script>
</head>
<body>
<div class="center">
     <div class="login-card">
        <div class="login-header">
            <div class="shield">
              <h2>🛡️</h2>
              <p> Admin Login<p>
             <b>Welcome to Admin Panel</b>
            </div>

      
     
     <form method="POST" style="width: 460px;height: 300px;background-color:white; padding: 20px; border-radius: 0px;">
        {% csrf_token %}
      
          
         
            {% if error %}
              <p class="error-message">{{ error }}</p>
            {% endif %}<br>
           <div class="input-group">
            <input type="text" name="username" class="input-box" placeholder="Enter username">
           </div><br>
            {% if error1 %}
              <p class="error-message">{{ error1 }}</p>
            {% endif %}<br>
        <div class="input-group">
        <input type="password" name="password" class="input-box"  placeholder="Enter password">
       

        </div></br>

     
  
        <p1><a href="{% url 'forgot_password' %}">Forgot Password?</a></p1>
        
        <div class="input-group">
        <center> <button type="submit" style="color: blue;">Login</button> </center>
        </div><br>
       
        <p>
        Don't have an account?
        <a href="{% url 'register' %}">Create Account</a>
        </p>
     </form>
   
    </div>
</div>
</div>

  
</body>
</html>
