{% load static %}
<head>
    <link rel="stylesheet" href="{% static 'css/top-deals.css' %}">
</head>
<section class="tech-deals-section">

    <div class="tech-deals-heading">
        <h2>✨ Top deals on tech</h2>

                        <div class="tech-image">
                            <img src="https://images.unsplash.com/photo-1592750475338-74b7b21085ab?auto=format&fit=crop&w=600&q=80"
                    alt="Smartphone">
                            <div class="tech-price">From ₹25,999*</div>
                        </div>
                        <p>Smartphones</p>
                    </a>
                </article>

                <article class="tech-card">
                    <a href="#" class="tech-product-link">

                                 alt="Refrigerator">
                            <div class="tech-price">From ₹17,990*</div>
                        </div>

                    </a>
                </article>

                <article class="tech-card">
                    <a href="#" class="tech-product-link">

                </article>
