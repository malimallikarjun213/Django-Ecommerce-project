<html>
<head>
    <meta name="viewport" content="device-width ,initial-scale=1.0">
    <title>This is login page</title>
    <style>
body{
    min-height: 100vh;
    background: rgb(227, 223, 223);
    

}
.center{   
    align-items: center;
    margin-left: calc(50% - 250px);
    position: center; 
}
form {
    width: 400px;
    margin: 100px auto;
}
.login-card{
    width: 500px;
    height: 600px;
    border-radius: 25px;
    background:white;
    
}
.login-header{
    background: darkblue;
    text-align: center;
    color: black;
    width: 500px ;
    height:200px;
     border-radius: 20px;
    
}
.shield{
    font-size: 38px;  
    background-color: darkblue;
    border-radius: 25px;
    height: 60px;
}
.shield h2,p{ margin-bottom: 15px; margin-top: 20px;color: black;}
.shield b{ margin-bottom: 15px; margin-top: 20px;color:rgb(57, 130, 246);}
.input-group{
    margin-bottom: 15px;
}

button{
   width: 150px;
   height: 25px;
    background-color: pink;
    font-size: 15px;
    font-weight: bold;
    
}
.error-message {
         color: red;     
        text-align: center; 
        margin:0px; 
        font-size: 18px;
        font-style: monospace;
        margin-left: 125px;
       position:absolute;   
    }
.input-box{
    font-size: 20px;
    font-weight: black;
    width: 100%;
    height: 50px;
    border: 2px blue solid;
    border-radius: 10px;
}

success-message p1{
    font-size: 20px;
    font-weight: bold;
    margin-right: 5px;   
    }
    </style>
    <script>
    setTimeout(function() {
        var message = document.getElementsByClassName("error-message")[0];

        if (message) {
            message.style.display = "none";
        }
    }, 3000);
</script>
</head>
<body>
<div class="center">
     <div class="login-card">
        <div class="login-header">
            <div class="shield">
              <h2>🛡️</h2>
              <p> Admin Login<p>
              <b>Change Password</b>
            </div>

      
         
    
     <form method="POST" style="width: 460px;height: 300px;background-color:white; padding: 20px; border-radius: 0px;">
        
        {% csrf_token %}
       {% if success %}
        <script>
            alert("{{ success }}");
        </script>
         {% endif %}<br>

       {% if error1 %}
       <p class="error-message">{{ error1 }}</p>
         {% endif %}<br>
      
      
         <div class="input-group">
            <input type="text" name="username" class="input-box" placeholder="Enter username"><br><br>
         </div>
      
        <div class="input-group">
        <input type="password" name="new_password" class="input-box" placeholder="Enter new password"><br><br>
        </div>

           {% if error %} 
              <p class="error-message">{{ error }}</p>
            {% endif %}<br>

     <div class="input-group">
        <input type="password" name="confirm_password" class="input-box" placeholder="Confirm password" required><br><br>
     </div>
        
        
       <center><button type="submit" style="color: blue;">Change Password</button></center> <br>
      <p>
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
     </p>
    </form>

    
    </div>
 </div>
</div>

  
</body>
</html>
